name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [plus-updated]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: sagi-plus checkout
        uses: actions/checkout@v4
        with:
          repository: nihatygci/sagi-plus
          token: ${{ secrets.PLUS_REPO_TOKEN }}
          path: sagi-plus-temp

      - name: plus.js kopyala
        run: cp sagi-plus-temp/plus.js plus.js

      - name: operations.js kopyala
        run: cp sagi-plus-temp/operations.js operations.js

      - name: Pages için hazırla
        uses: actions/configure-pages@v5

      - name: Eski github-pages artifact'larını temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name=="github-pages") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Dosyaları yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy et
        id: deployment
        uses: actions/deploy-pages@v4